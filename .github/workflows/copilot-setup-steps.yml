name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # Job name MUST be exactly this for Copilot to pick it up
  copilot-setup-steps:
    # Copilot agents only run on Ubuntu x64
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Show OS info
        run: |
          uname -a
          lsb_release -a || true

      - name: Install Swift build deps
        run: |
          sudo apt-get update
          # Covers both 22.04 (gcc-11) and 24.04 (gcc-13) variants from swift.org
          sudo apt-get install -y \
            binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libncurses-dev libpython3-dev libsqlite3-0 libxml2-dev libz3-dev \
            pkg-config tzdata unzip zlib1g-dev || true
          # Best-effort for gcc/libstdc++ versions across images
          sudo apt-get install -y libgcc-11-dev libstdc++-11-dev || true
          sudo apt-get install -y libgcc-13-dev libstdc++-13-dev || true

      - name: Download Swift 6.2 snapshot (Ubuntu 22.04/24.04)
        env:
          SWIFT_BRANCH: swift-6.2-branch
        run: |
          set -euxo pipefail
          . /etc/os-release
          case "$VERSION_ID" in
            22.04) UB="ubuntu22.04" UBDIR="ubuntu2204" ;;
            24.04) UB="ubuntu24.04" UBDIR="ubuntu2404" ;;
            *) echo "Unsupported Ubuntu $VERSION_ID" >&2; exit 1 ;;
          esac

          # Pick a recent snapshot (you can pin to an exact snapshot if you want)
          SNAP_INDEX="latest-build.yml"
          BASE="https://download.swift.org/${SWIFT_BRANCH}/${UBDIR}"
          SNAP_NAME=$(curl -sSL "${BASE}/${SNAP_INDEX}" | awk -F': ' '/^dir:/{print $2}')
          TARBALL=$(curl -sSL "${BASE}/${SNAP_INDEX}" | awk -F': ' '/^download:/{print $2}')
          SIGFILE=$(curl -sSL "${BASE}/${SNAP_INDEX}" | awk -F': ' '/^download_signature:/{print $2}')

          curl -fLO "${BASE}/${SNAP_NAME}/${TARBALL}"
          curl -fLO "${BASE}/${SNAP_NAME}/${SIGFILE}"

      - name: Verify Swift PGP signature
        run: |
          set -euxo pipefail
          wget -q -O - https://swift.org/keys/all-keys.asc | gpg --import -
          SIG=$(ls *.tar.gz.sig)
          TAR=${SIG%.sig}
          gpg --verify "$SIG" "$TAR"

      - name: Install Swift toolchain
        run: |
          set -euxo pipefail
          TAR=$(ls swift-*.tar.gz)
          mkdir -p "$HOME/swift"
          tar -xzf "$TAR" -C "$HOME/swift"
          TOOLCHAIN_DIR="$HOME/swift/$(basename "$TAR" .tar.gz)"
          echo "${TOOLCHAIN_DIR}/usr/bin" >> "$GITHUB_PATH"
          echo "SWIFT_PATH=${TOOLCHAIN_DIR}/usr/bin" >> "$GITHUB_ENV"

      - name: Check Swift version
        run: swift --version
